    <!-- Main Content -->
    <main role="main" class="flex-grow pt-32 pb-20">
        <div class="max-w-7xl mx-auto px-4 md:px-16">
            <div class="bg-surface/90 backdrop-blur-sm rounded-lg border border-outline-variant p-8 shadow-lg">
                <h1 class="font-headline-md text-4xl text-white mb-6 border-b border-outline-variant pb-4">Login</h1>
                <div class="content-area">
                    <div class="max-w-md mx-auto">
    <form onsubmit="return false;" method="POST" id="login-form" class="space-y-6">
        <div>
            <label for="email" class="block text-sm font-medium text-secondary mb-2" data-i18n="login-email">Email Address</label>
            <input type="email" id="email" name="email" required
                class="w-full px-4 py-3 bg-[#18202d] border border-outline-variant rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-primary-container transition-all">
        </div>
        <div>
            <label for="password" class="block text-sm font-medium text-secondary mb-2" data-i18n="login-password">Password</label>
            <input type="password" id="password" name="password" required
                class="w-full px-4 py-3 bg-[#18202d] border border-outline-variant rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-primary-container transition-all">
        </div>
        <div id="login-error" class="text-red-500 text-sm hidden"></div>
        <button type="submit"
            class="w-full bg-primary-container text-on-primary-container font-semibold py-3 rounded-lg hover:opacity-90 transition-opacity" data-i18n="login-btn">
            Sign In
        </button>

        <div class="my-6 flex items-center">
            <div class="flex-grow border-t border-gray-700"></div>
            <span class="mx-4 text-sm text-secondary">OR</span>
            <div class="flex-grow border-t border-gray-700"></div>
        </div>

        <button type="button" id="btn-google" class="w-full flex items-center justify-center gap-3 bg-white text-gray-800 font-semibold py-3 px-4 border border-gray-300 rounded-lg shadow-sm hover:bg-gray-100 transition-colors">
            <img loading="lazy" decoding="async" src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
            Continue with Google
        </button>
        <p class="text-center text-secondary text-sm mt-4">
            <span data-i18n="login-no-account">Don't have an account?</span> 
            <a href="register.html" class="text-primary-container hover:underline" data-i18n="login-register-link">Register here</a>
        </p>
    </form>
</div>
